services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.local
      args:
        VITE_OIDC_AUTHORITY: ${VITE_OIDC_AUTHORITY:-http://localhost:8080/realms/bo}
        VITE_OIDC_CLIENT_ID: ${VITE_OIDC_CLIENT_ID:-bo-web}
    image: bo-local:dev
    environment:
      HOST: 0.0.0.0
      PORT: 8888
    ports:
      - "8888:8888"
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    volumes:
      - ./docker/keycloak/realm.json:/opt/keycloak/data/import/realm.json
    restart: unless-stopped

  minio:
    profiles: ["minio"]
    image: pgsty/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./local-data/minio:/data
    restart: unless-stopped
